[metadata]
name = space-comms-digital-twin
description = Space mission comms digital twin
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/quantumworld-dpdns-io/space-mission-comms-digital-twin
project_urls =
    Bug Tracker = https://github.com/quantumworld-dpdns-io/space-mission-comms-digital-twin/issues
    Documentation = https://github.com/quantumworld-dpdns-io/space-mission-comms-digital-twin/docs
    Source Code = https://github.com/quantumworld-dpdns-io/space-mission-comms-digital-twin

[options]
package_dir =
    = src/python
packages = find_namespace:
python_requires = >=3.11
include_package_data = True

[options.extras_require]
test =
    pytest>=8.0
    pytest-cov>=5.0
    pytest-asyncio>=0.24

[egg_info]
tag_build =
tag_date = 0

[aliases]
dev = develop
test = pytest
