apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: space-comms-twin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: space-comms-twin
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
