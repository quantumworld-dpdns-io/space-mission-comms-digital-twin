apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-comms-twin
  labels:
    app: space-comms-twin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: space-comms-twin
  template:
    metadata:
      labels:
        app: space-comms-twin
    spec:
      containers:
      - name: api
        image: ghcr.io/quantumworld-dpdns-io/space-mission-comms-digital-twin:latest
        ports:
        - containerPort: 8000
        env:
        - name: APP_NAME
          value: "SpaceCommsDigitalTwin"
        - name: DEBUG
          value: "false"
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
