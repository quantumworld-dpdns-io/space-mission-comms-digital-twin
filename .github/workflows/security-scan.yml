name: Security Scan
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  robot-security:
    runs-on: ubuntu-latest
    services:
      zap:
        image: ghcr.io/zaproxy/zaproxy:stable
        ports:
          - 8080:8080
        options: >-
          --entrypoint zap.sh
          -- -daemon -port 8080 -host 0.0.0.0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Robot Framework + ZAP lib
        run: |
          pip install robotframework robotframework-requests robotframework-zaplibrary
      - name: Start API server
        run: |
          pip install -e ".[dev]"
          uvicorn space_comms_digital_twin.api.rest.app:app --host 0.0.0.0 --port 8000 &
          sleep 5
      - name: Run Robot OWASP tests
        run: |
          robot --outputdir robot_output \
            --include security \
            tests/robot/ || true
      - name: Run ZAP baseline scan
        run: |
          docker run --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000 -r zap_report.html || true
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            robot_output/
            zap_report.html
