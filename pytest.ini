[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
addopts = -v --cov=src/python --cov-report=term-missing --cov-report=xml
asyncio_mode = auto
markers =
    quantum: marks tests that require quantum SDKs
    gpu: marks tests that require GPU
    slow: marks slow integration tests
    security: marks security-related tests
    robot: marks Robot Framework tests
