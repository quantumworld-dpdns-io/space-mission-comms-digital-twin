[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-comms-digital-twin"
dynamic = ["version"]
description = "Space mission comms digital twin – simulation SaaS modeling latency, antenna visibility, and bandwidth bottlenecks before launch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "quantumworld-dpdns-io", email = "dev@quantumworld.io" },
]
keywords = ["quantum", "space", "communications", "digital-twin", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Communications",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "astropy>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "click>=8.1",
    "rich>=13.7",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "orjson>=3.9",
    "sgp4>=2.22",
]

[project.optional-dependencies]
gpu = [
    "cudaq; platform_system == 'Linux'",
]
quantum = [
    "qiskit>=1.0",
    "qiskit-aer",
    "cirq>=1.3",
    "pennylane>=0.35",
    "qutip>=5.0",
    "strawberryfields>=0.23",
    "amazon-braket-sdk>=1.75",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "bandit>=1.7",
    "safety>=3.1",
    "coverage>=7.4",
    "robotframework>=7.0",
    "robotframework-requests>=0.9",
    "robotframework-zaplibrary>=1.3",
    "maturin>=1.5",
    "types-requests",
]
all = [
    "space-comms-digital-twin[gpu]",
    "space-comms-digital-twin[quantum]",
    "space-comms-digital-twin[dev]",
]

[project.entry-points]
console_scripts = [
    "sct = space_comms_digital_twin.cli.main:cli",
]

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["space_comms_digital_twin*"]

[tool.setuptools.dynamic]
version = { attr = "space_comms_digital_twin.__version__.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PT", "RUF"]
ignore = ["D"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/python --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"
markers = [
    "quantum: marks tests that require quantum SDKs",
    "gpu: marks tests that require GPU",
    "slow: marks slow integration tests",
    "security: marks security-related tests",
    "robot: marks Robot Framework tests",
]

[tool.coverage.run]
source = ["src/python"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "src/python/space_comms_digital_twin/__version__.py:__version__"
]
build_command = "pip install build && python -m build"
commit_parser = "angular"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
branches = ["main"]
upload_to_repository = true
upload_to_release = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B311"]
